[functions]
  node_bundler = "esbuild"   # modern bundler, smaller zip

# API proxy → function
[[redirects]]
  from = "/api/chat"
  to   = "/.netlify/functions/chat"
  status = 200

# SPA fallback (React Router support)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
